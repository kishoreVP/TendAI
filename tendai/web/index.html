<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TendAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#f4f6fb; --panel:#fff; --ink:#141a2e; --muted:#6b7389; --line:#e5e8f0; --accent:#4f46e5; --accent2:#06b6d4;
  --meets:#16a34a; --meets-bg:#e7f7ed; --fails:#dc2626; --fails-bg:#fdeaea; --insuf:#d97706; --insuf-bg:#fdf3e1;
  --review:#2563eb; --review-bg:#e6eefd; --na:#94a3b8; --na-bg:#eef1f5; --hl:rgba(255,196,0,.32);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06); --radius:14px;
}
* { box-sizing:border-box }
html, body { margin:0; height:100% }
body { font:14px/1.5 Inter, system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
button, select, input, textarea { font:inherit; color:inherit }
a { color:var(--accent); cursor:pointer; text-decoration:none } a:hover { text-decoration:underline }

/* top bar */
.top { display:flex; align-items:center; gap:18px; padding:12px 22px; color:#fff;
  background:linear-gradient(115deg,#1e1b4b 0%,#3730a3 45%,#0e7490 100%); position:sticky; top:0; z-index:20; flex-wrap:wrap }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.3px }
.brand small { display:block; font-weight:500; font-size:11px; opacity:.75; letter-spacing:0 }
.top select { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:9px; padding:6px 10px }
.top select option { color:#111 }
.nav { display:flex; gap:4px; margin-left:auto; background:rgba(255,255,255,.1); padding:4px; border-radius:11px }
.nav button { background:none; border:0; color:#e0e7ff; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:500 }
.nav button.active { background:#fff; color:#1e1b4b }

.shell { display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; padding:18px 22px; align-items:start }
.shell.full { grid-template-columns:minmax(0,1fr) }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow) }
.pad { padding:18px }
h2 { font-size:20px; margin:0 } h3 { font-size:15px; margin:0 0 10px } .muted { color:var(--muted) } .small { font-size:12px }

/* bidder rail */
.rail h4 { margin:2px 4px 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted) }
.bidder { padding:14px; margin-bottom:10px; cursor:pointer; transition:.15s; border:2px solid transparent }
.bidder:hover { transform:translateY(-1px) } .bidder.sel { border-color:var(--accent); box-shadow:0 6px 24px rgba(79,70,229,.18) }
.bidder .row1 { display:flex; align-items:center; gap:10px }
.avatar { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-weight:700; color:#fff; flex:none }
.rank { margin-left:auto; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:#eef2ff; color:var(--accent) }
.rank.l1 { background:#dcfce7; color:#166534 }
.bar { display:flex; height:7px; border-radius:6px; overflow:hidden; background:var(--na-bg); margin:10px 0 6px }
.bar span { display:block; height:100% }

/* hero */
.hero { display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center }
.donut { width:132px; height:132px }
.verdict { font-size:13px; font-weight:600; padding:4px 10px; border-radius:20px; display:inline-block; margin:6px 0 }
.facts { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px }
.fact { background:var(--bg); border-radius:10px; padding:8px 12px } .fact b { display:block; font-size:16px }
.btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; cursor:pointer; font-weight:500; display:inline-flex; gap:6px; align-items:center }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff } .btn:hover { filter:brightness(.97) }
.tabs { display:flex; gap:6px; margin:16px 0 12px }
.tabs button { border:0; background:none; padding:8px 14px; border-radius:9px; cursor:pointer; font-weight:600; color:var(--muted) }
.tabs button.active { background:var(--ink); color:#fff }
.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px }
.chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:4px 12px; cursor:pointer; font-size:13px }
.chip.on { background:var(--ink); color:#fff; border-color:var(--ink) }
.search { border:1px solid var(--line); border-radius:20px; padding:5px 12px; min-width:200px; background:#fff }

/* findings */
.finding { display:grid; grid-template-columns:5px minmax(0,1fr); overflow:hidden; margin-bottom:12px }
.finding .stripe { background:var(--na) }
.finding .body { padding:14px 16px }
.fhead { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap }
.fhead .id { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--muted) }
.pill { display:inline-block; border-radius:20px; padding:2px 10px; font-size:11.5px; font-weight:700; white-space:nowrap }
.vs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px }
.side { background:var(--bg); border-radius:10px; padding:10px 12px; min-width:0 }
.side .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600 }
.side .val { font-weight:700; font-size:15px; margin:2px 0 6px; word-break:break-word }
.snap { width:100%; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; background:#fff; display:block; min-height:30px }
.snap:hover { outline:2px solid var(--accent) }
.why { margin-top:10px; font-size:13px } .tag { font-size:11px; border:1px solid var(--line); border-radius:5px; padding:0 5px; margin-right:4px; font-weight:600 }
.tag.ai { border-color:#c026d3; color:#c026d3 } .tag.fact { border-color:var(--meets); color:var(--meets) } .tag.rule { border-color:var(--review); color:var(--review) }
details.decide { margin-top:10px } details.decide summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:13px }
.decide-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap } .decide-row select, .decide-row input { border:1px solid var(--line); border-radius:8px; padding:6px 8px }

.MEETS_REQUIREMENT { --c:var(--meets); --b:var(--meets-bg) } .DOES_NOT_MEET_REQUIREMENT { --c:var(--fails); --b:var(--fails-bg) }
.INSUFFICIENT_EVIDENCE { --c:var(--insuf); --b:var(--insuf-bg) } .REQUIRES_HUMAN_REVIEW { --c:var(--review); --b:var(--review-bg) }
.NOT_APPLICABLE { --c:var(--na); --b:var(--na-bg) }
.pill, .verdict { background:var(--b); color:var(--c) } .finding .stripe { background:var(--c) }

table { border-collapse:collapse; width:100% } th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top }
th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfe; position:sticky; top:62px; z-index:1 }
.cmp { height:8px; border-radius:6px; background:var(--na-bg); position:relative; min-width:120px; margin-top:6px }
.cmp i { position:absolute; top:0; bottom:0; border-radius:6px } .cmp em { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink) }
.notice { background:#fff8e6; border:1px solid #f4dca4; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px }
.flag { color:#b45309; font-size:12.5px }

/* source viewer drawer */
.drawer { position:fixed; top:0; right:0; height:100vh; width:min(720px,96vw); background:var(--panel); z-index:50;
  box-shadow:-12px 0 40px rgba(16,24,40,.25); transform:translateX(105%); transition:transform .25s; display:flex; flex-direction:column }
.drawer.open { transform:none }
.dbar { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.dbar b { flex:1; min-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.dbody { overflow:auto; flex:1; padding:14px; background:#eef1f7; position:relative }
.pagewrap { position:relative; margin:0 auto } .pagewrap canvas { display:block; box-shadow:0 2px 10px rgba(0,0,0,.18) }
.hl { position:absolute; background:var(--hl); outline:2px solid #f59e0b; border-radius:2px; pointer-events:none; animation:pulse 1.4s ease-out 2 }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(245,158,11,.6) } 100% { box-shadow:0 0 0 14px rgba(245,158,11,0) } }
.sheet td { font-size:11.5px; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; background:#fff }
.sheet tr.hit td { background:#fff4c2 } .sheet td.hitcell { outline:3px solid #f59e0b; font-weight:700 }
.sheet th { position:sticky; top:0 }
.loading { padding:40px; text-align:center; color:var(--muted) }
.scrim { position:fixed; inset:0; background:rgba(15,23,42,.25); z-index:40; display:none } .scrim.open { display:block }
@media (max-width:900px) { .shell { grid-template-columns:1fr } .hero { grid-template-columns:1fr } .vs { grid-template-columns:1fr } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#fff" fill-opacity=".15"/>
      <path d="M9 11h16M17 11v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="24" r="4" fill="#22d3ee"/></svg>
    <div>TendAI<small>Evidence-grounded tender evaluation</small></div>
  </div>
  <select id="case" title="Procurement case"></select>
  <select id="run" title="Evaluation run"></select>
  <nav class="nav" id="nav"></nav>
</header>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dbar"><b id="vtitle">Source</b>
    <button class="btn" id="prev">‹</button><span id="vpage" class="small"></span><button class="btn" id="next">›</button>
    <a id="vdownload" target="_blank" class="small">original ↗</a><button class="btn" id="vclose">✕</button></div>
  <div id="vnote" class="small muted" style="padding:6px 14px"></div>
  <div class="dbody" id="vbody"></div>
</aside>
<script src="app.js?v=2"></script>
</body>
</html>
