<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GammaPrime Evaluation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec; --accent:#2f5bea;
  --meets:#dff3e4; --meets-ink:#17602f; --fails:#fde2e1; --fails-ink:#a02622; --insuf:#fff1cc; --insuf-ink:#7a5600;
  --review:#e3ecfb; --review-ink:#204a97; --na:#eceef2; --hl:rgba(255,196,0,.35); }
* { box-sizing:border-box } body { margin:0; font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink) }
header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap }
header h1 { font-size:15px; margin:0 12px 0 0 } select,input,button,textarea { font:inherit }
select,input,textarea { border:1px solid var(--line); border-radius:6px; padding:4px 6px; background:#fff }
button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
nav button.active { background:var(--ink); color:#fff }
main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,46%); height:calc(100vh - 54px) }
#content { overflow:auto; padding:14px 16px }
#viewer { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-width:0 }
#viewer .bar { padding:8px 10px; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; flex-wrap:wrap }
#viewer .body { overflow:auto; flex:1; position:relative; padding:8px }
.pagewrap { position:relative; margin:0 auto } .pagewrap canvas { display:block; box-shadow:0 1px 4px rgba(0,0,0,.15) }
.hl { position:absolute; background:var(--hl); outline:2px solid #e0a800; pointer-events:none }
table { border-collapse:collapse; width:100%; background:var(--panel) } th,td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top }
th { position:sticky; top:0; background:#fafbfc; font-weight:600; z-index:1 }
.card th { position:static }
tr.click:hover { background:#f3f6ff; cursor:pointer }
.pill { display:inline-block; border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; white-space:nowrap }
.MEETS_REQUIREMENT { background:var(--meets); color:var(--meets-ink) } .DOES_NOT_MEET_REQUIREMENT { background:var(--fails); color:var(--fails-ink) }
.INSUFFICIENT_EVIDENCE { background:var(--insuf); color:var(--insuf-ink) } .REQUIRES_HUMAN_REVIEW { background:var(--review); color:var(--review-ink) }
.NOT_APPLICABLE { background:var(--na) }
.muted { color:var(--muted) } .flag { color:#a05a00 } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px }
.stat b { font-size:20px; display:block } .tag { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-right:4px }
.tag.ai { border-color:#b16; color:#b16 } .tag.fact { border-color:#2a7; color:#2a7 } .tag.rule { border-color:#25b; color:#25b }
.filters { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap } .sheet td { font-size:11px; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis }
.sheet tr.hit td { background:#fff4c2 } .sheet td.hitcell { outline:2px solid #e0a800 } a { color:var(--accent); cursor:pointer }
.notice { background:#fff8e6; border:1px solid #f2d999; padding:8px 10px; border-radius:6px; margin-bottom:10px }
@media (max-width:900px) { main { grid-template-columns:1fr; height:auto } #viewer { min-height:70vh } }
</style>
</head>
<body>
<header>
  <h1>GammaPrime.ai</h1>
  <label>Case <select id="case"></select></label>
  <label>Run <select id="run"></select></label>
  <nav id="tabs"></nav>
  <span id="status" class="muted"></span>
</header>
<main>
  <section id="content"></section>
  <aside id="viewer">
    <div class="bar"><b id="vtitle">Source viewer</b>
      <button id="prev">‹</button><span id="vpage"></span><button id="next">›</button>
      <input id="vsearch" placeholder="search text in document" size="18"><a id="vdownload" target="_blank">original</a>
    </div>
    <div id="vnote" class="muted" style="padding:0 10px"></div>
    <div class="body" id="vbody"><p class="muted">Click any evidence or source link to open the document here.</p></div>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
